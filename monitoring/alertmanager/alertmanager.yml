# Alertmanager Configuration for Chinook Application
# Handles alert routing, grouping, and notification delivery

global:
  # Global configuration
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@chinook-app.local'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: false
  
  # Slack configuration (optional)
  slack_api_url: ''
  
  # Default notification settings
  resolve_timeout: 5m

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  # Root route - all alerts start here
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  
  # Sub-routes for specific alert types
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 15m
    
    # Warning alerts - grouped notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    
    # Database alerts
    - match:
        service: postgres
      receiver: 'database-alerts'
      group_by: ['alertname', 'instance']
      group_wait: 30s
      repeat_interval: 30m
    
    # Application service alerts
    - match_re:
        service: ^(auth|app|catalogos|web)$
      receiver: 'application-alerts'
      group_by: ['alertname', 'service', 'instance']
      group_wait: 30s
      repeat_interval: 30m
    
    # Infrastructure alerts
    - match_re:
        alertname: ^(NodeDown|HighCPU|HighMemory|DiskSpaceLow)$
      receiver: 'infrastructure-alerts'
      group_by: ['alertname', 'instance']
      repeat_interval: 1h

# Inhibition rules - suppress alerts when others are firing
inhibit_rules:
  # Suppress warning alerts when critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']
  
  # Suppress individual service alerts when the entire node is down
  - source_match:
      alertname: 'NodeDown'
    target_match_re:
      alertname: '^(ServiceDown|HighCPU|HighMemory)$'
    equal: ['instance']

# Notification receivers
receivers:
  # Default webhook receiver
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: 'webhook_password'
        title: 'Chinook Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

  # Critical alerts - multiple notification channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@chinook-app.local'
        from: 'alerts@chinook-app.local'
        subject: 'CRITICAL: Chinook Application Alert'
        body: |
          Critical alert in Chinook application:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ if .EndsAt }}Ended: {{ .EndsAt }}{{ end }}
          
          Labels:
          {{ range .Labels.SortedPairs }}  {{ .Name }}: {{ .Value }}
          {{ end }}
          {{ end }}
        headers:
          Priority: 'high'
    
    # Slack notification (if configured)
    slack_configs:
      - api_url: '{{ .SlackAPIURL }}'
        channel: '#alerts-critical'
        title: 'CRITICAL: Chinook Application Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        color: 'danger'
        send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'team@chinook-app.local'
        from: 'alerts@chinook-app.local'
        subject: 'WARNING: Chinook Application Alert'
        body: |
          Warning alert in Chinook application:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

  # Database-specific alerts
  - name: 'database-alerts'
    email_configs:
      - to: 'dba@chinook-app.local'
        from: 'alerts@chinook-app.local'
        subject: 'Database Alert: {{ .GroupLabels.alertname }}'
        body: |
          Database alert in Chinook application:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Database: {{ .Labels.datname }}
          Instance: {{ .Labels.instance }}
          Value: {{ .Annotations.value }}
          Started: {{ .StartsAt }}
          {{ end }}

  # Application service alerts
  - name: 'application-alerts'
    email_configs:
      - to: 'developers@chinook-app.local'
        from: 'alerts@chinook-app.local'
        subject: 'Application Alert: {{ .GroupLabels.service }}'
        body: |
          Application service alert:
          
          {{ range .Alerts }}
          Service: {{ .Labels.service }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt }}
          {{ end }}

  # Infrastructure alerts
  - name: 'infrastructure-alerts'
    email_configs:
      - to: 'ops@chinook-app.local'
        from: 'alerts@chinook-app.local'
        subject: 'Infrastructure Alert: {{ .GroupLabels.alertname }}'
        body: |
          Infrastructure alert:
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Value: {{ .Annotations.value }}
          Started: {{ .StartsAt }}
          {{ end }}